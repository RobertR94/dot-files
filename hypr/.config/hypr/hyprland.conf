autogenerated = 0
$mainMod = SUPER
$terminal = ghostty
$fileManager = dolphin
$menu = hyprlauncher
# autostart
exec-once = waybar
exec-once = hyprpaper
exec-once = hypridle
exec-once = hyprctl setcursor breeze_cursors 24
# monitors
monitor = HDMI-A-2,preferred,auto,1
# Menu
$menu = rofi -show drun
# Keybinds
# General
bind = $mainMod, T, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, E, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, M, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, space, exec, $menu
bind = $mainMod, F, fullscreen
bind = $mainMod, L, exec, hyprlock
# Coontrol
bind = $mainMod, A , exec, pavucontrol
# Default workspaces
bind = $mainMod SHIFT, 1, workspace, 1
bind = $mainMod SHIFT, 1, exec, sleep 0.2 && ghostty
bind = $mainMod SHIFT, 2, workspace, 2
bind = $mainMod SHIFT, 2, workspace, 2
bind = $mainMod SHIFT, 2, exec, sleep 0.2 && ghostty
bind = $mainMod SHIFT, 3, workspace, 3
bind = $mainMod SHIFT, 3, exec, sleep 0.2 && firefox
bind = $mainMod SHIFT, 4, workspace, 4
bind = $mainMod SHIFT, 4, exec, sleep 0.2 && code
bind = $mainMod SHIFT, 5, workspace, 5
bind = $mainMod SHIFT, 5, exec, sleep 0.2 && firefox --new-window https://youtube.com
bind = $mainMod SHIFT, 6, workspace, 6
bind = $mainMod SHIFT, 6, exec, sleep 0.2 && android-studio
bind = $mainMod SHIFT, 7, workspace, 7
bind = $mainMod SHIFT, 7, exec, sleep 0.2 && discord
# Movement
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod CTRL, 1, movetoworkspace, 1
bind = $mainMod CTRL, 2, movetoworkspace, 2
bind = $mainMod CTRL, 3, movetoworkspace, 3
bind = $mainMod CTRL, 4, movetoworkspace, 4
bind = $mainMod CTRL, 5, movetoworkspace, 5
bind = $mainMod CTRL, 6, movetoworkspace, 6
bind = $mainMod CTRL, 7, movetoworkspace, 7
bind = $mainMod CTRL, 8, movetoworkspace, 8
bind = $mainMod CTRL, 9, movetoworkspace, 9
bind = $mainMod, h, movefocus, l
bind = $mainMod, j, movefocus, d
bind = $mainMod, k, movefocus, u
bind = $mainMod, l, movefocus, r
# Utilities
# Screenshot selected area and copy to clipboard
bind = $mainMod, p, exec, grim -g "$(slurp)" - | wl-copy
# Screenshot selected area, save to file, and copy to clipboard
bind = $mainMod CTRL, p, exec, mkdir -p ~/Pictures/Screenshots && grim -g "$(slurp)" ~/Pictures/Screenshots/Screenshot_$(date +'%Y-%m-%d_%H-%M-%S').png && wl-copy < ~/Pictures/Screenshots/Screenshot_$(date +'%Y-%m-%d_%H-%M-%S').png
# Styling
general {
    gaps_in = 4
    gaps_out = 0
    border_size = 0
}
# Cursor
env = XCURSOR_THEME,breeze_cursors
env = XCURSOR_SIZE,24
exec-once = hyprctl setcursor breeze_cursors 24
